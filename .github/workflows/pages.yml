name: Test and deploy WishPlan to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Unit and integration contracts
        run: npm test
      - name: Firestore isolation, schema, quota and RTDB emulator tests
        run: npm run test:firebase
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage only public static files
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          rsync -a --exclude='.*' assets guide checkkol ghepanh grab tetlasy tools workflows lab about _site/
          node scripts/disable-public-cloud.cjs
          touch _site/.nojekyll
      - name: Upload static artifact (never Functions, tests, dependencies or secrets)
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload completion can precede visibility in the API read by deploy-pages.
          for attempt in {1..18}; do
            if json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"); then
              count=$(jq --arg name "$PAGES_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<< "$json")
              if [ "$count" -eq 1 ]; then exit 0; fi
              if [ "$count" -gt 1 ]; then
                echo "::error::More than one artifact matches $PAGES_ARTIFACT_NAME."
                exit 1
              fi
            fi
            if [ "$attempt" -lt 18 ]; then sleep 5; fi
          done
          echo "::error::Artifact $PAGES_ARTIFACT_NAME did not become visible in time."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
